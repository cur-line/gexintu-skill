<canvas width="1080" height="1920"></canvas><script>

 }

function captions(){const groups=[];let offset=0;for(let phrase of scene.narration.split(/[，。！？；：、,.!?;:]/).filter(Boolean)){let size=Math.ceil(phrase.length/Math.ceil(phrase.length/13));for(let j=0;j<phrase.length;j+=size)groups.push(scene.words.slice(offset+j,offset+Math.min(phrase.length,j+size)));offset+=phrase.length}let current=groups.find(a=>a.length&&t>=a[0].s&&t<a.at(-1).e+.03);if(current){rr(72,1550,936,132,P.paper,22);text(current.map(w=>w.t).join(''),540,1616,59,P.ink,'center',false,880)}}
